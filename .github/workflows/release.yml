name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check the tag against the versions
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const cargo = readFileSync('../Cargo.toml', 'utf8');
          const crate = /^\[workspace\.package\][^[]*?^version = "([^"]+)"/m.exec(cargo)?.[1];
          const tag = process.env.GITHUB_REF_NAME;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag ?? '') || tag !== version)
            throw new Error(`Tag ${tag} must match package.json's version ${version}.`);
          if (lock.version !== version || lock.packages[''].version !== version)
            throw new Error('package-lock.json must match package.json.');
          if (crate !== version) throw new Error(`Cargo.toml's version ${crate} must match ${version}.`);
          console.log(`Releasing mekaweb ${version}`);
          NODE
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interface
          path: web/dist
          if-no-files-found: error

  binaries:
    needs: interface
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: interface
          path: web/dist
      # musl-gcc builds the vendored OpenSSL and SQLite into a binary that runs on any Linux.
      - run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: rustup toolchain install stable --profile minimal --target "$TARGET"
      - run: cargo build --release --locked --target "$TARGET" -p mekaweb
      - run: cp "target/$TARGET/release/mekaweb" "mekaweb-${{ matrix.arch }}-linux"
      - name: Check the binary runs
        run: ./mekaweb-${{ matrix.arch }}-linux --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mekaweb-${{ matrix.arch }}-linux
          path: mekaweb-${{ matrix.arch }}-linux
          if-no-files-found: error

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mekaweb-*-linux
          merge-multiple: true
          path: release
      - name: Write checksums and notes
        run: |
          chmod +x release/mekaweb-*
          (cd release && sha256sum mekaweb-* > SHA256SUMS)
          awk -v version="$GITHUB_REF_NAME" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --title "mekaweb $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

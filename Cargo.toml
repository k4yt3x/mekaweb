[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.29.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/k4yt3x/mekaweb"

[workspace.lints.clippy]
await_holding_lock = "deny"
expect_used = "warn"
indexing_slicing = "warn"
match_wildcard_for_single_variants = "warn"
panic = "warn"
redundant_clone = "warn"
significant_drop_tightening = "warn"
uninlined_format_args = "warn"
unreachable = "warn"
unused_async = "warn"
unwrap_used = "warn"

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
